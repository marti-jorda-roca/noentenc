name: CI

on:
  push:
    branches: [main]
  # Every pull request, including those stacked on another branch.
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_NO_PROGRESS: "1"

jobs:
  security:
    name: Trivy security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml

  lint:
    name: Ruff and ty
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true
      - run: uv python install
      - run: uv sync --locked --all-extras --group dev
      - run: uv run --no-sync ruff check . --output-format=github
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ty check --output-format=github

  unit-tests:
    name: Unit tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every Python version and OS that pyproject.toml declares.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --all-extras --group dev
      - run: uv run --no-sync coverage run -m pytest tests/unit --strict-config --strict-markers -v --tb=short
      - run: uv run --no-sync coverage report

  # The "Protect main" ruleset requires a check named exactly "Unit tests"; matrix jobs
  # report as "Unit tests / <os> / Python <version>", so this job stands in for all of them.
  unit-tests-gate:
    name: Unit tests
    if: always()
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every unit-test job passed
        env:
          RESULT: ${{ needs.unit-tests.result }}
        run: |
          echo "unit-tests matrix: $RESULT"
          test "$RESULT" = "success"

  install-smoke:
    name: Wheel quickstart / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv build --wheel --no-sources
      - name: Detection quickstart, core install only
        run: uv run --no-project --isolated --with dist/*.whl python scripts/smoke_quickstart.py detection
        env:
          NOENTENC_CACHE: ${{ runner.temp }}/noentenc
      # The README gives pip and uv equally; check pip installs the wheel the same way.
      - name: Detection quickstart, core install with pip
        run: |
          venv="$RUNNER_TEMP/pip-venv"
          uv venv --seed "$venv"
          python="$venv/bin/python"
          [ -x "$python" ] || python="$venv/Scripts/python.exe"
          "$python" -m pip install --quiet dist/*.whl
          "$python" scripts/smoke_quickstart.py detection
        env:
          NOENTENC_CACHE: ${{ runner.temp }}/noentenc
      - name: Translation quickstart, translation extra
        run: |
          wheel=$(ls dist/*.whl)
          uv run --no-project --isolated --with "noentenc[translation] @ $wheel" python scripts/smoke_quickstart.py translation
        env:
          NOENTENC_CACHE: ${{ runner.temp }}/noentenc
      # docs/cli.md, offline on the weights the steps above downloaded.
      - name: Command line, cli extra
        run: |
          wheel=$(ls dist/*.whl)
          # Without the extra, the command exits with 1 and names it.
          if uv run --no-project --isolated --with "$wheel" noentenc 2> missing.txt; then exit 1; fi
          grep -q "noentenc\[cli\]" missing.txt
          noentenc() { uv run --no-project --isolated --with "noentenc[cli,translation] @ $wheel" noentenc "$@"; }
          label=$(noentenc detect --offline "Bon dia! Com estàs?" | tr -d '\r')
          test "$label" = "cat"
          printf 'Hola, ¿cuándo llega mi pedido?\nThanks, it works now.\n' \
            | noentenc translate --to en --offline | tr -d '\r' | tee translations.txt
          grep -q "order" translations.txt
          grep -qx "Thanks, it works now." translations.txt
          noentenc download --pair es:en --dry-run
          noentenc list --task detection
          noentenc info
        env:
          NOENTENC_CACHE: ${{ runner.temp }}/noentenc

  integration-tests:
    name: Integration tests / ${{ matrix.suite }}
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [language_detection, translation]
    env:
      NOENTENC_RUN_INTEGRATION: "1"
      # Keep numpy and ONNX inference within the standard runner's CPU allocation.
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true
      - run: uv python install
      - run: uv sync --locked --extra translation --extra onnx --group dev
      - run: uv run --no-sync pytest tests/integrations/${{ matrix.suite }} --strict-config --strict-markers -v --tb=short
        env:
          NOENTENC_CACHE: ${{ runner.temp }}/noentenc

  build:
    name: Build and check distributions
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true
      - run: uv python install
      - name: Check release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?", tag):
              raise SystemExit(f"Unsupported release tag: {tag}")
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match package version {version}")
          PY
      - run: uv build --no-sources
      - run: uvx --from 'twine>=6,<7' twine check --strict dist/*
      - name: Smoke test wheel and source distribution in isolated environments
        run: |
          for distribution in dist/*.whl dist/*.tar.gz; do
            uv run --no-project --isolated --with "$distribution" python -I -c \
              'from noentenc import Language; from noentenc.language_detection import LanguageDetector; from noentenc.translation import Translator; from importlib.metadata import version; print(version("noentenc"))'
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 3
