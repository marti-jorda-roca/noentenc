[project]
name = "noentenc"
version = "0.3.0"
description = "Lightweight, CPU-only language detection and translation for Python. Translation and extra detection backends are optional extras."
readme = "README.md"
authors = [
    { name = "marti-jorda-roca", email = "mjorda98@gmail.com" }
]
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# The core install runs the default detection models (fastText, langid) with numpy only.
dependencies = [
    "numpy>=2.0",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
translation = [
    "huggingface-hub>=1.33.0",
    "onnxruntime>=1.30.0",
    "tokenizers>=0.23.2",
]
# The ONNX detection models (`OnnxClassifierModel`).
onnx = [
    "onnxruntime>=1.30.0",
    "tokenizers>=0.23.2",
]
pandas = ["pandas>=3.0.6"]
polars = ["polars>=1.44.2"]
# 2.2 has no Python 3.11 wheels.
lingua = ["lingua-language-detector>=2.1.1"]
cld3 = ["cld3-py>=3.1"]
heliport = ["heliport>=1.0.1; sys_platform != 'win32'"]
all = ["noentenc[translation,onnx,pandas,polars,lingua,cld3,heliport]"]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "coverage>=7.16.2",
    "library-skills>=0.0.19",
    "pandas>=3.0.6",
    "polars>=1.44.2",
    "prek>=0.5.4",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.84",
    "zizmor>=1.30.1",
]


[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed,
    "C90", # cyclomatic complexity
    "PLR", # pylint-style size limits
    "ERA",   # Commented-out code
    "SIM",   # Simplifiable/redundant constructs
    "RET",   # Redundant return patterns
    "PIE",   # Miscellaneous unnecessary code
    "B",     # Bugbear, including duplicate/redundant constructs
    "ANN",   # Missing annotations and explicit Any checks
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e
    "PLR0913", # Too many arguments
]

[tool.ruff.lint.per-file-ignores]
# Magic values are the point in tests and one-off scripts; only library code must name them.
# Examples print results and show expected output in comments.
"docs/examples/**/*.py" = ["PLR2004", "T201", "ERA001"]
"scripts/**/*.py" = ["PLR2004", "T201"]
"tests/**/*.py" = ["PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-returns = 6
max-statements = 50
max-args = 8
max-nested-blocks = 5

[tool.ty.terminal]
error-on-warning = true

[tool.ty.src]
include = ["src", "tests", "docs"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Projects share test module basenames (e.g. test_train_model.py); importlib mode
# gives each file a unique module name instead of colliding on sys.modules.
addopts = "--import-mode=importlib"
consider_namespace_packages = true
markers = [
    "integration: needs real model weights (downloads them); run with NOENTENC_RUN_INTEGRATION=1",
]
